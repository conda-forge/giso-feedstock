schema_version: 1

context:
  python_min: "3.11"
  version: "1.0.2"

package:
  name: giso
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/giso/giso-${{ version }}.tar.gz
  sha256: 83057c2fa8b5a98eccc14b4dfb01f3476497d7fdba7d0ab2ab1977ba510e7f5c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - giso = giso._cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - geoarrow-pyarrow >=0.3.0
    - geopandas >=1.2.0
    - rich-click >=1.9.0
    - sedonadb >=0.5.0

tests:
  - python:
      imports:
        - giso
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - giso --help

about:
  summary: A simple command line tool to help with geocoding country/region ISO 3166-2 codes
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/giso/

extra:
  recipe-maintainers:
    - p-vdp
